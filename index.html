<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trip Planner</title>
<meta name="description" content="Trip planning template: day-by-day timeline, progress checklist, shared expenses, and dark mode.">
<meta name="theme-color" content="#FAF6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1913" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="tripTitle"></h1>
    <p class="subtitle" id="tripSubtitle"></p>
  </div>
  <button class="settings-btn" id="settingsBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
  </button>
</div>

<button class="fab-gastos" id="expensesBtn" aria-label="Open shared expenses">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 012-2h13a1 1 0 011 1v3"/><path d="M3 7v11a2 2 0 002 2h14a1 1 0 001-1V10a1 1 0 00-1-1H8a2 2 0 000 4h12"/></svg>
  <span class="fab-label">Expenses</span>
  <span class="fab-total" id="fabTotal">0€</span>
</button>

<div class="next-banner" id="nextBanner" role="status">
  <div class="nb-icon" id="nbIcon" aria-hidden="true">📍</div>
  <div class="nb-text">
    <div class="nb-label">Next stop</div>
    <div class="nb-title" id="nbTitle"></div>
  </div>
</div>

<div id="panels"></div>

<div class="expense-panel" id="panel-expenses">
  <button class="pill-btn" id="backFromExpenses" style="margin:16px 0 0;">← Back to plan</button>
  <div class="daymeta" style="padding-left:0;padding-right:0;">
    <div class="datebig" style="color:var(--de);">Shared wallet</div>
    <h2>Expenses</h2>
  </div>
  <div class="expense-form">
    <label for="expDesc">Expense description</label>
    <input id="expDesc" class="full" placeholder="What was it for? (e.g. Saturday dinner)">
    <label for="expAmount">Amount in euros</label>
    <input id="expAmount" type="number" step="0.01" placeholder="€" class="full">
    <button class="add-expense-btn" id="expAdd">Add expense</button>
  </div>
  <div id="expenseList"></div>
  <div class="summary-card" id="expenseSummary"></div>
</div>

<div class="tabbar" id="tabbar"></div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <h3>Settings</h3>
    <p class="sheet-sub">Customize how you view the plan.</p>

    <div class="switch-row">
      <span class="switch-label" id="darkLabel">🌙 Dark mode</span>
      <button class="switch" id="darkSwitch" role="switch" aria-checked="false" aria-labelledby="darkLabel"><span class="knob"></span></button>
    </div>
    <div class="switch-row">
      <span class="switch-label" id="compactLabel">▤ Compact view</span>
      <button class="switch" id="compactSwitch" role="switch" aria-checked="false" aria-labelledby="compactLabel"><span class="knob"></span></button>
    </div>

    <div class="sheet-divider"></div>
    <h3 style="font-size:16px;">Icon legend</h3>
    <p class="sheet-sub">Each activity uses one of these icons depending on its type.</p>
    <div id="legendList"></div>

    <button class="sheet-close" id="sheetClose">Close</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
